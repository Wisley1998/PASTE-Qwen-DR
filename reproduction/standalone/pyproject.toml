[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "paste-qwen-dr"
version = "0.1.0"
description = "Standalone PASTE reproduction for Qwen DeepResearch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["aiohttp==3.12.15"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
paste-trace = "paste_repro.cli:main"

[tool.setuptools.packages.find]
where = ["reproduction"]
include = ["paste_repro*"]
